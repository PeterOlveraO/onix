name: Build

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.6"

defaults:
  run:
    working-directory: app

jobs:
  test:
    name: Analyze y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  android:
    name: APK Android
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Firmado con la llave de debug: suficiente para instalar a mano (sideload).
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: onix-android
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  ios:
    name: IPA iOS (sin firmar)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Sin firma: Sideloadly lo firma con tu Apple ID al instalarlo.
      - run: flutter build ios --release --no-codesign
      - name: Empaquetar .ipa
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa && zip -qry onix.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: onix-ios
          path: app/build/ipa/onix.ipa
          retention-days: 30
